<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRISMA Professional SLR Workspace</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff', 100: '#e0effe', 500: '#3b82f6', 600: '#2563eb',
              700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .highlight-match { background-color: #fef08a; color: #854d0e; font-weight: 600; border-radius: 2px; padding: 0 2px; }
    .dark .highlight-match { background-color: #854d0e; color: #fef08a; }
    @media print {
      .no-print { display: none !important; }
      body { background-color: white !important; color: black !important; }
    }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-150">
  <div id="root" class="h-full"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    Babel.registerPreset('react-classic', {
      presets: [ [Babel.availablePresets['react'], { runtime: 'classic' }] ]
    });
  </script>

  <script type="text/babel" data-presets="react-classic">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==============================================================================
    // ☁️ FIREBASE CLOUD SYNC CONFIGURATION
    // ==============================================================================
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDOtonMvhKkoYcq4tHR3DEmJenSpP4aYPw",
      authDomain: "prism-c0399.firebaseapp.com",
      projectId: "prism-c0399",
      storageBucket: "prism-c0399.firebasestorage.app",
      messagingSenderId: "418429283718",
      appId: "1:418429283718:web:d3ad698927030cd15e9007",
      measurementId: "G-VQCHMC3DP3"
    };
    // ==============================================================================

    const INITIAL_COHORT = [];

    const COCHRANE_ROB_DOMAINS = [
      { id: "bias1", name: "D1: Bias arising from the randomization process" },
      { id: "bias2", name: "D2: Bias due to deviations from intended interventions" },
      { id: "bias3", name: "D3: Bias due to missing outcome data" },
      { id: "bias4", name: "D4: Bias in measurement of the outcome" },
      { id: "bias5", name: "D5: Bias in selection of the reported result" }
    ];

    const PRISMA_CHECKLIST_ITEMS = [
      { id: "item-1", section: "Title", title: "Title Identification", recommendation: "Identify the report as a systematic review in the title." },
      { id: "item-2", section: "Abstract", title: "Structured Abstract", recommendation: "Provide a structured summary including background, objectives, and eligibility." },
      { id: "item-3", section: "Introduction", title: "Rationale / Frame", recommendation: "Describe the rationale for the review in context of existing knowledge." },
      { id: "item-4", section: "Introduction", title: "Explicit Objectives", recommendation: "Provide an explicit statement of the objective(s) framed using PICO terms." },
      { id: "item-5", section: "Methods", title: "Eligibility Criteria", recommendation: "Specify the inclusion and exclusion criteria for literature selection." },
      { id: "item-6", section: "Methods", title: "Information Sources", recommendation: "Detail all databases, dates of search, and registry systems queried." }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState("tutorial"); 
      const [darkMode, setDarkMode] = useState(false);
      
      const [reviewTitle, setReviewTitle] = useState("");
      const [articles, setArticles] = useState(INITIAL_COHORT);
      const [selectedArtId, setSelectedArtId] = useState("");
      const [screeningFilter, setScreeningFilter] = useState("All");

      const [searchEngine, setSearchEngine] = useState("openalex"); 
      const [searchQuery, setSearchQuery] = useState("");
      const [searchLoading, setSearchLoading] = useState(false);
      const [searchResults, setSearchResults] = useState([]);
      const [searchError, setSearchError] = useState("");

      const [rawIngestText, setRawIngestText] = useState("");
      
      // Auto-assign Reviewer role based on the invite URL
      const [currentReviewer, setCurrentReviewer] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        return params.get('role') === 'reviewerB' ? 'reviewerB' : 'reviewerA';
      }); 
      
      const [picoKeywords, setPicoKeywords] = useState("");

      const [checklistProgress, setChecklistProgress] = useState({
        "item-1": { status: "Not Started", draft: "" },
        "item-2": { status: "Not Started", draft: "" },
        "item-3": { status: "Not Started", draft: "" },
        "item-4": { status: "Not Started", draft: "" },
        "item-5": { status: "Not Started", draft: "" },
        "item-6": { status: "Not Started", draft: "" }
      });

      const [blindMode, setBlindMode] = useState(true);
      const [toast, setToast] = useState({ show: false, msg: "", type: "success" });

      // Cloud State
      const [cloudStatus, setCloudStatus] = useState("disconnected"); 
      const lastSyncedState = useRef("");
      const cloudSetupDone = useRef(false);
      const isInitialLoad = useRef(true);
      const [workspaceId, setWorkspaceId] = useState("");

      const triggerToast = (msg, type = "success") => {
        setToast({ show: true, msg, type });
        setTimeout(() => setToast({ show: false, msg: "", type: "success" }), 4000);
      };

      // Toast notification when joining via an invite link
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('role') === 'reviewerB') {
          setTimeout(() => triggerToast("Joined workspace as Reviewer 2 (Beta)!", "success"), 1000);
        }
      }, []);

      useEffect(() => {
        if (cloudSetupDone.current) return;
        cloudSetupDone.current = true;
        
        let unsubscribe = null;
        const initCloud = async () => {
          try {
            setCloudStatus("connecting");
            
            if (!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey) {
              setCloudStatus("disconnected");
              return; 
            }
            
            const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
            const { getAuth, signInAnonymously } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
            const { getFirestore, doc, setDoc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

            const app = initializeApp(FIREBASE_CONFIG);
            const auth = getAuth(app);
            const db = getFirestore(app);

            await signInAnonymously(auth);

            if (!auth.currentUser) {
              setCloudStatus("error");
              triggerToast("Database Auth Failed", "error");
              return;
            }

            window._db = db;
            window._setDoc = setDoc;
            
            let wid = window.location.hash.substring(1);
            if (!wid) { 
              wid = Math.random().toString(36).substring(2, 12); 
              try {
                window.history.replaceState(null, null, `${window.location.pathname}${window.location.search}#${wid}`); 
              } catch (e) {
                try {
                  window.location.hash = wid;
                } catch (err) {
                  console.warn("Sandbox environment prevented URL update.");
                }
              }
            }
            setWorkspaceId(wid);

            const docRef = doc(db, 'workspaces', wid);
            window._docRef = docRef;

            unsubscribe = onSnapshot(docRef, (snapshot) => {
              if (snapshot.exists()) {
                const data = snapshot.data();
                const defaultChecklist = {
                  "item-1": { status: "Not Started", draft: "" }, "item-2": { status: "Not Started", draft: "" },
                  "item-3": { status: "Not Started", draft: "" }, "item-4": { status: "Not Started", draft: "" },
                  "item-5": { status: "Not Started", draft: "" }, "item-6": { status: "Not Started", draft: "" }
                };

                const safeData = {
                  articles: data.articles || [],
                  reviewTitle: data.reviewTitle || "",
                  checklistProgress: data.checklistProgress || defaultChecklist
                };
                
                const dataStr = JSON.stringify(safeData);
                if (dataStr !== lastSyncedState.current) {
                  lastSyncedState.current = dataStr;
                  setArticles(safeData.articles);
                  setReviewTitle(safeData.reviewTitle);
                  setChecklistProgress(safeData.checklistProgress);
                }
              } else {
                lastSyncedState.current = JSON.stringify({ articles, reviewTitle, checklistProgress });
              }
              setCloudStatus("connected");
              isInitialLoad.current = false;
            }, (error) => {
              console.error("Sync error:", error);
              setCloudStatus("error");
            });

          } catch (err) {
            console.error("Cloud init failed:", err);
            setCloudStatus("disconnected");
          }
        };

        initCloud();
        return () => { if (unsubscribe) unsubscribe(); }
      }, []);

      useEffect(() => {
        if (cloudStatus !== "connected" || !window._setDoc || !window._docRef || isInitialLoad.current) return;
        
        const currentData = { articles, reviewTitle, checklistProgress };
        const currentStr = JSON.stringify(currentData);
        
        if (currentStr !== lastSyncedState.current) {
          lastSyncedState.current = currentStr;
          const timeout = setTimeout(async () => {
            try {
              await window._setDoc(window._docRef, { ...currentData, lastUpdated: Date.now() }, { merge: true });
            } catch (err) {
              console.error("Failed to push updates:", err);
            }
          }, 800); 
          return () => clearTimeout(timeout);
        }
      }, [articles, reviewTitle, checklistProgress, cloudStatus]);

      const toggleDarkMode = () => {
        setDarkMode(!darkMode);
        if (!darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      };

      const copyShareLink = () => {
        // Embeds ?role=reviewerB directly into the link they copy
        const fullUrl = `${window.location.origin}${window.location.pathname}?role=reviewerB#${workspaceId}`;
        
        navigator.clipboard.writeText(fullUrl).then(() => {
          triggerToast("Invite link copied! Send it to your co-reviewer.", "success");
        }).catch(() => {
          const dummy = document.createElement('input');
          document.body.appendChild(dummy);
          dummy.value = fullUrl;
          dummy.select();
          document.execCommand('copy');
          document.body.removeChild(dummy);
          triggerToast("Invite link copied! Send it to your co-reviewer.", "success");
        });
      };

      const handleMultiEngineSearch = async () => {
        if (!searchQuery.trim()) {
          triggerToast("Please input a scientific query", "warning");
          return;
        }
        setSearchLoading(true);
        setSearchError("");
        setSearchResults([]);

        try {
          let endpoint = "";
          let mapped = [];

          if (searchEngine === "openalex") {
            endpoint = `https://api.openalex.org/works?search=${encodeURIComponent(searchQuery)}&per-page=50&mailto=your-workspace@prismaflow.org`;
            const res = await fetch(endpoint);
            if (!res.ok) throw new Error(`OpenAlex HTTP Error: ${res.status}`);
            const data = await res.json();
            
            mapped = data.results.map(work => {
              const parsedAuthors = work.authorships?.slice(0, 3).map(a => a.author?.display_name).join(", ") + (work.authorships?.length > 3 ? " et al." : "");
              return {
                id: work.id || `oa-${Math.random().toString(36).substr(2, 9)}`,
                title: work.title || "Untitled Literature",
                authors: parsedAuthors || "Unknown Investigators",
                journal: work.primary_location?.source?.display_name || "Academic Proceeding",
                abstract: work.abstract_inverted_index ? reconstructAbstract(work.abstract_inverted_index) : "No abstract description indexed.",
                status: "Identified", source: "OpenAlex", notes: "",
                reviewerVotes: { reviewerA: null, reviewerB: null },
                rob: { bias1: "Low", bias2: "Low", bias3: "Low", bias4: "Low", bias5: "Low", summary: "Low" }
              };
            });
          } else if (searchEngine === "crossref") {
            endpoint = `https://api.crossref.org/works?query=${encodeURIComponent(searchQuery)}&rows=50`;
            const res = await fetch(endpoint);
            if (!res.ok) throw new Error(`CrossRef HTTP Error: ${res.status}`);
            const data = await res.json();

            mapped = (data.message?.items || []).map(item => {
              const parsedAuthors = item.author?.slice(0, 3).map(a => `${a.given || ""} ${a.family || ""}`).join(", ") || "Unknown Investigators";
              return {
                id: item.DOI || `cr-${Math.random().toString(36).substr(2, 9)}`,
                title: item.title?.[0] || "Untitled CrossRef Registry",
                authors: parsedAuthors,
                journal: item["container-title"]?.[0] || "CrossRef DOI Publisher",
                abstract: "Abstract meta-tag not accessible via fast CrossRef API indexing.",
                status: "Identified", source: "CrossRef", notes: "",
                reviewerVotes: { reviewerA: null, reviewerB: null },
                rob: { bias1: "Low", bias2: "Low", bias3: "Low", bias4: "Low", bias5: "Low", summary: "Low" }
              };
            });
          }

          setSearchResults(mapped);
          if (mapped.length === 0) setSearchError("No publications matched your search descriptors.");
          else triggerToast(`Found ${mapped.length} papers!`, "success");
        } catch (err) {
          setSearchError(`Could not retrieve literature: ${err.message}.`);
        } finally {
          setSearchLoading(false);
        }
      };

      const reconstructAbstract = (invertedIndex) => {
        try {
          const words = [];
          Object.entries(invertedIndex).forEach(([word, positions]) => {
            positions.forEach(pos => { words[pos] = word; });
          });
          return words.join(" ");
        } catch (e) { return "Abstract extraction error."; }
      };

      const importToScreening = (paper) => {
        if (articles.some(a => a.title.toLowerCase().trim() === paper.title.toLowerCase().trim())) {
          triggerToast("This publication is already in your screening cohort.", "warning");
          return;
        }
        setArticles(prev => [paper, ...prev]);
        setSelectedArtId(paper.id);
        triggerToast("Imported successfully to Abstract Screening!", "success");
      };

      const handleRawIngest = () => {
        if (!rawIngestText.trim()) return triggerToast("Ingest field is empty.", "warning");
        const lines = rawIngestText.split('\n');
        let importedCount = 0;
        
        if (rawIngestText.includes("TY  -") || rawIngestText.includes("ER  -")) {
          let currentPaper = { id: "", title: "", authors: "", journal: "", abstract: "", status: "Identified", source: "Local Import", reviewerVotes: { reviewerA: null, reviewerB: null }, rob: { bias1: "Low", bias2: "Low", bias3: "Low", bias4: "Low", bias5: "Low", summary: "Low" } };
          lines.forEach(line => {
            const match = line.match(/^([A-Z0-9]{2})\s*-\s*(.*)$/);
            if (match) {
              const tag = match[1], val = match[2].trim();
              if (tag === "TI" || tag === "T1") currentPaper.title = val;
              else if (tag === "AU") currentPaper.authors += (currentPaper.authors ? ", " : "") + val;
              else if (tag === "JO" || tag === "JF") currentPaper.journal = val;
              else if (tag === "AB" || tag === "N2") currentPaper.abstract = val;
              else if (tag === "PY") currentPaper.authors += ` (${val})`;
            }
            if (line.trim() === "ER  -") {
              if (currentPaper.title) {
                currentPaper.id = `ris-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
                setArticles(prev => [currentPaper, ...prev]);
                importedCount++;
              }
              currentPaper = { id: "", title: "", authors: "", journal: "", abstract: "", status: "Identified", source: "Local Import", reviewerVotes: { reviewerA: null, reviewerB: null }, rob: { bias1: "Low", bias2: "Low", bias3: "Low", bias4: "Low", bias5: "Low", summary: "Low" } };
            }
          });
        } else if (rawIngestText.includes("@article") || rawIngestText.includes("@inproceedings") || rawIngestText.includes("@book")) {
          const titleMatch = rawIngestText.match(/title\s*=\s*[{"]([^}"]+)[}"]/i);
          const authorMatch = rawIngestText.match(/author\s*=\s*[{"]([^}"]+)[}"]/i);
          const journalMatch = rawIngestText.match(/journal\s*=\s*[{"]([^}"]+)[}"]/i);
          const abstractMatch = rawIngestText.match(/abstract\s*=\s*[{"]([^}"]+)[}"]/i);
          if (titleMatch) {
            setArticles(prev => [{
              id: `bib-${Date.now()}`, title: titleMatch[1],
              authors: authorMatch ? authorMatch[1] : "Unknown Authors",
              journal: journalMatch ? journalMatch[1] : "Indexed Monograph",
              abstract: abstractMatch ? abstractMatch[1] : "No abstract parsed in bibTeX block.",
              status: "Identified", source: "Local Import",
              reviewerVotes: { reviewerA: null, reviewerB: null },
              rob: { bias1: "Low", bias2: "Low", bias3: "Low", bias4: "Low", bias5: "Low", summary: "Low" }
            }, ...prev]);
            importedCount++;
          }
        }
        if (importedCount > 0) {
          triggerToast(`Successfully imported ${importedCount} studies!`, "success");
          setRawIngestText(""); setActiveTab("screening");
        } else triggerToast("Failed to parse standard RIS or BibTeX markers.", "error");
      };

      const handleReviewerVote = (artId, reviewer, vote) => {
        setArticles(prev => prev.map(art => {
          if (art.id === artId) {
            const updatedVotes = { ...art.reviewerVotes, [reviewer]: vote };
            let nextStatus = art.status;
            if (updatedVotes.reviewerA === "Approve" && updatedVotes.reviewerB === "Approve") nextStatus = "Sought_Retrieval";
            else if (updatedVotes.reviewerA === "Exclude" && updatedVotes.reviewerB === "Exclude") nextStatus = "Excluded_Screening";
            else if (updatedVotes.reviewerA && updatedVotes.reviewerB && updatedVotes.reviewerA !== updatedVotes.reviewerB) nextStatus = "Conflict";
            else nextStatus = "Identified";
            return { ...art, reviewerVotes: updatedVotes, status: nextStatus };
          }
          return art;
        }));
        triggerToast(`${reviewer === 'reviewerA' ? 'R1' : 'R2'} voted: ${vote}`, "success");
      };

      const resolveConflict = (artId, resolution) => {
        setArticles(prev => prev.map(art => {
          if (art.id === artId) return { ...art, status: resolution === "Approve" ? "Sought_Retrieval" : "Excluded_Screening", reviewerVotes: { reviewerA: resolution, reviewerB: resolution } };
          return art;
        }));
        triggerToast("Conflict resolved.", "success");
      };

      const updateRoBDomain = (artId, domainId, rating) => {
        setArticles(prev => prev.map(art => {
          if (art.id === artId) {
            const currentRob = { ...art.rob, [domainId]: rating };
            const vals = Object.entries(currentRob).filter(([k]) => k !== 'summary').map(([, v]) => v);
            let summaryRating = vals.includes("High") ? "High" : vals.includes("Some Concerns") ? "Some Concerns" : "Low";
            return { ...art, rob: { ...currentRob, summary: summaryRating } };
          }
          return art;
        }));
      };

      const highlightKeywords = (text) => {
        if (!picoKeywords.trim()) return text;
        const keywords = picoKeywords.split(',').map(k => k.trim()).filter(Boolean);
        if (keywords.length === 0) return text;
        try {
          const escapedKeywords = keywords.map(k => k.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'));
          const regex = new RegExp(`\\b(${escapedKeywords.join('|')})\\b`, 'gi');
          return text.split(regex).map((part, index) => regex.test(part) ? <span key={index} className="highlight-match">{part}</span> : part);
        } catch (e) { return text; }
      };

      // Workspace Export / Import (Fallback for offline mode)
      const exportWorkspace = () => {
        const data = { reviewTitle, articles, checklistProgress };
        const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `PRISMA_Workspace_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        triggerToast("Workspace exported successfully!", "success");
      };

      const handleImportWorkspace = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.articles) setArticles(data.articles);
            if (data.reviewTitle) setReviewTitle(data.reviewTitle);
            if (data.checklistProgress) setChecklistProgress(data.checklistProgress);
            triggerToast("Workspace loaded successfully!", "success");
          } catch (err) { triggerToast("Invalid workspace file. Could not parse JSON.", "error"); }
        };
        reader.readAsText(file);
      };

      const metrics = useMemo(() => {
        const total = articles.length;
        const conflicts = articles.filter(a => a.status === "Conflict").length;
        const excludedAbstract = articles.filter(a => a.status === "Excluded_Screening").length;
        const retrieved = articles.filter(a => ["Sought_Retrieval", "Eligibility", "Included", "Excluded_Eligibility"].includes(a.status)).length;
        const included = articles.filter(a => a.status === "Included").length;
        return { total, conflicts, excludedAbstract, retrieved, included };
      }, [articles]);

      return (
        <div className="h-full flex flex-col overflow-hidden">
          
          {toast.show && (
            <div className="fixed top-4 right-4 z-50 flex items-center p-4 bg-slate-900 text-white rounded-lg shadow-2xl border border-brand-500 animate-fade-in">
              <span className="mr-3">{toast.type === 'success' ? <i className="fa-solid fa-circle-check text-emerald-400"></i> : <i className="fa-solid fa-triangle-exclamation text-amber-400"></i>}</span>
              <p className="text-xs font-semibold">{toast.msg}</p>
            </div>
          )}

          <header className="no-print bg-slate-900 text-white border-b border-slate-800 flex items-center justify-between px-6 py-4 flex-shrink-0">
            <div className="flex items-center space-x-3">
              <div className="bg-blue-600 h-9 w-9 rounded-lg flex items-center justify-center">
                <i className="fa-solid fa-shield text-white"></i>
              </div>
              <div>
                <h1 className="text-md font-bold tracking-tight">PRISMA Flow Workspace</h1>
                <p className="text-[10px] text-slate-400">Professional Systematic Synthesis Tool</p>
              </div>
            </div>

            <div className="hidden md:flex items-center space-x-2 bg-slate-800 border border-slate-700 rounded-full px-4 py-1">
              <span className="text-xs text-brand-400 font-bold">Project:</span>
              <input 
                type="text" 
                value={reviewTitle} 
                onChange={(e) => setReviewTitle(e.target.value)}
                placeholder="Name Your Systematic Review..."
                className="bg-transparent border-none text-xs text-slate-200 placeholder-slate-500 focus:outline-none w-56 font-semibold"
              />
            </div>

            <div className="flex items-center space-x-3">
              
              {/* Live Collaboration Sync Status Area */}
              <div className="hidden lg:flex items-center space-x-3 border-r border-slate-700 pr-3">
                <div className="flex items-center space-x-1.5 text-[10px] font-bold text-slate-400">
                  {cloudStatus === "connecting" && <><i className="fa-solid fa-spinner animate-spin text-blue-400"></i><span>Connecting...</span></>}
                  {cloudStatus === "disconnected" && <><i className="fa-solid fa-cloud-bolt text-slate-500"></i><span>Offline Mode</span></>}
                  {cloudStatus === "error" && <><i className="fa-solid fa-triangle-exclamation text-red-400"></i><span>Sync Error</span></>}
                  {cloudStatus === "connected" && <><span className="relative flex h-2 w-2"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span></span><span className="text-emerald-400">Live Sync Active</span></>}

                      <button onClick={() => window.print()} className="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition"><i className="fa-solid fa-print"></i><span>Print Flow Chart</span></button>
                    </div>
                    <div className="flex flex-col items-center py-6 overflow-x-auto">
                      <div className="min-w-[650px] space-y-6">
                        <div className="flex justify-center space-x-12">
                          <div className="w-72 bg-blue-50 dark:bg-blue-950/20 border-2 border-blue-200 dark:border-blue-900 rounded-xl p-4 text-center"><span className="text-[9px] font-bold text-blue-500 uppercase block tracking-wider">Identification</span><h4 className="text-3xl font-extrabold text-blue-700 dark:text-blue-400 mt-1">{metrics.total}</h4></div>
                          <div className="w-72 bg-slate-50 dark:bg-slate-855 border border-slate-200 dark:border-slate-800 rounded-xl p-4 text-center"><span className="text-[9px] font-bold text-slate-400 uppercase block tracking-wider">Duplicate Removal</span><h4 className="text-2xl font-extrabold text-slate-600 dark:text-slate-400 mt-1">0</h4></div>
                        </div>
                        <div className="flex justify-center"><i className="fa-solid fa-arrow-down-long text-slate-300 text-xl"></i></div>
                        <div className="flex justify-center space-x-12">
                          <div className="w-72 bg-amber-50 dark:bg-amber-950/20 border-2 border-amber-200 dark:border-amber-900 rounded-xl p-4 text-center"><span className="text-[9px] font-bold text-amber-500 uppercase block tracking-wider">Abstract Screening</span><h4 className="text-3xl font-extrabold text-amber-700 dark:text-amber-400 mt-1">{metrics.total - metrics.conflicts}</h4></div>
                          <div className="w-72 bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-900 rounded-xl p-4 text-center"><span className="text-[9px] font-bold text-red-500 uppercase block tracking-wider">Abstracts Excluded</span><h4 className="text-2xl font-extrabold text-red-700 dark:text-red-400 mt-1">{metrics.excludedAbstract}</h4></div>
                        </div>
                        <div className="flex justify-center"><i className="fa-solid fa-arrow-down-long text-slate-300 text-xl"></i></div>
                        <div className="flex justify-center space-x-12">
                          <div className="w-72 bg-indigo-50 dark:bg-indigo-950/20 border-2 border-indigo-200 dark:border-indigo-900 rounded-xl p-4 text-center"><span className="text-[9px] font-bold text-indigo-500 uppercase block tracking-wider">Full-Text Assessment</span><h4 className="text-3xl font-extrabold text-indigo-700 dark:text-indigo-400 mt-1">{metrics.retrieved}</h4></div>
                          <div className="w-72 bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-900 rounded-xl p-4 text-center"><span className="text-[9px] font-bold text-red-500 uppercase block tracking-wider">Full-Text Excluded</span><h4 className="text-2xl font-extrabold text-red-700 dark:text-red-400 mt-1">{articles.filter(a => a.status === "Excluded_Eligibility").length}</h4></div>
                        </div>
                        <div className="flex justify-center"><i className="fa-solid fa-arrow-down-long text-slate-300 text-xl"></i></div>
                        <div className="flex justify-center"><div className="w-96 bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-2xl p-6 text-center shadow-md"><span className="text-[10px] font-bold uppercase tracking-wider opacity-90">Included Literature Synthesis</span><h4 className="text-4xl font-black my-1">{metrics.included}</h4></div></div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* CHECKLIST TAB */}
              {activeTab === "checklist" && (
                <div className="space-y-6">
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-2xl shadow-sm space-y-4">
                    <h3 className="text-sm font-bold dark:text-white">PRISMA 2020 Compliance Checklist</h3>
                  </div>
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
                    <div className="lg:col-span-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 space-y-2">
                      <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Checklist Sections</span>
                      <div className="space-y-1">
                        {PRISMA_CHECKLIST_ITEMS.map((item) => {
                          const state = checklistProgress[item.id] || { status: "Not Started", draft: "" };
                          return (
                            <div key={item.id} className="p-2 bg-slate-50 dark:bg-slate-855 rounded-lg text-xs flex justify-between items-center">
                              <div><div className="font-bold">{item.title}</div><div className="text-[9px] text-slate-400">{item.section}</div></div>
                              <span className={`text-[8px] font-bold px-1.5 py-0.5 rounded ${state.status === "Completed" ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800"}`}>{state.status}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                    <div className="lg:col-span-2 space-y-4">
                      {PRISMA_CHECKLIST_ITEMS.map((item) => {
                        const state = checklistProgress[item.id] || { status: "Not Started", draft: "" };
                        return (
                          <div key={item.id} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl shadow-sm space-y-3">
                            <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-2">
                              <div><span className="text-[9px] text-blue-500 uppercase font-bold">{item.section}</span><h4 className="text-xs font-bold">{item.title}</h4></div>
                              <select value={state.status} onChange={(e) => setChecklistProgress(prev => ({ ...prev, [item.id]: { ...state, status: e.target.value } }))} className="text-[10px] font-bold bg-slate-100 dark:bg-slate-800 p-1 rounded"><option value="Not Started">Not Started</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select>
                            </div>
                            <p className="text-[10px] text-slate-500 italic">{item.recommendation}</p>
                            <textarea rows="3" value={state.draft} onChange={(e) => setChecklistProgress(prev => ({ ...prev, [item.id]: { ...state, draft: e.target.value } }))} className="w-full text-xs p-2 bg-slate-50 dark:bg-slate-855 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none dark:text-white" placeholder="Write draft details..." />
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
